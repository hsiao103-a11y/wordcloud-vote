<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 免費雲端文字雲投票</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .flex { display: flex; gap: 20px; }
        .qr-card { text-align: center; min-width: 200px; }
        .vote-btn { display: block; width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; color: white; background: #007bff; border: none; border-radius: 8px; cursor: pointer; }
        .vote-btn:active { background: #0056b3; }
        #canvas-container { width: 100%; height: 400px; background: #fff; border: 1px solid #ddd; }
        .tag { display: inline-flex; align-items: center; background: #e9ecef; padding: 6px 12px; border-radius: 15px; margin: 4px; border: 1px solid #ccc; gap: 8px; }
        .del-btn { color: #dc3545; font-weight: bold; cursor: pointer; border: none; background: none; font-size: 16px; padding: 0 4px; line-height: 1; }
        .del-btn:hover { color: #a71d2a; }
        .empty-hint { color: #888; font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>

    <!-- 電腦大螢幕端 -->
    <div id="host-view">
        <div class="flex">
            <div class="card qr-card">
                <h3>📱 掃碼投票</h3>
                <div id="qrcode" style="display:flex; justify-content:center; align-items:center; min-height:160px;"></div>
            </div>
            <div class="card" style="flex:1;">
                <h3>⚙️ 選項管理</h3>
                <input type="text" id="new-opt" placeholder="輸入新選項" style="padding:6px;">
                <button onclick="addOption()" style="padding:6px 12px;">新增選項</button>
                <button onclick="resetVotes()" style="color:red; margin-left:10px; padding:6px 12px;">重置票數</button>
                <div id="options-list" style="margin-top: 12px;"></div>
            </div>
        </div>
        <div class="card">
            <h3>☁️ 即時票選文字雲</h3>
            <div id="canvas-container">
                <canvas id="cloud-canvas" width="850" height="400"></canvas>
            </div>
        </div>
    </div>

    <!-- 手機投票端 -->
    <div id="guest-view" style="display:none;" class="card">
        <h2>請選擇一項進行投票</h2>
        <div id="status-msg" style="color: #666; font-size: 14px; margin-bottom: 10px;">連線中...</div>
        <div id="vote-buttons"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const hostId = urlParams.get('host');

        // 全域資料預設為空
        let options = [];
        let votes = {};
        let connectedConns = [];
        let guestConn = null;

        // === 全域操作函數 ===
        function renderCloud() {
            const listEl = document.getElementById('options-list');
            if (listEl) {
                if (options.length === 0) {
                    listEl.innerHTML = `<div class="empty-hint">目前無選項，請在上方的輸入框新增選項。</div>`;
                } else {
                    listEl.innerHTML = options.map(opt => 
                        `<span class="tag">
                            ${opt} (${votes[opt]||0}票)
                            <button class="del-btn" onclick="removeOption('${opt}')" title="刪除選項">✕</button>
                        </span>`
                    ).join('');
                }
            }

            const cloudData = options.map(opt => [opt, (votes[opt] || 0) * 15 + 15]);
            WordCloud(document.getElementById('cloud-canvas'), {
                list: cloudData, gridSize: 8, weightFactor: 1, color: 'random-dark', rotateRatio: 0.2
            });
        }

        function broadcastOptions() {
            connectedConns.forEach(conn => {
                if (conn && conn.open) conn.send({ type: 'INIT', options: options });
            });
        }

        function addOption() {
            const val = document.getElementById('new-opt').value.trim();
            if (val && !options.includes(val)) {
                options.push(val);
                votes[val] = 0;
                document.getElementById('new-opt').value = '';
                renderCloud();
                broadcastOptions();
            }
        }

        function removeOption(opt) {
            options = options.filter(o => o !== opt);
            delete votes[opt];
            renderCloud();
            broadcastOptions();
        }

        function resetVotes() {
            if (options.length === 0) return;
            if (confirm('確定要重置所有票數嗎？')) {
                options.forEach(o => votes[o] = 0);
                renderCloud();
            }
        }

        function renderGuestButtons(opts) {
            const container = document.getElementById('vote-buttons');
            if (container) {
                if (opts.length === 0) {
                    container.innerHTML = `<div class="empty-hint">主控台尚未設定任何投票選項，請稍候...</div>`;
                } else {
                    container.innerHTML = opts.map(opt => 
                        `<button class="vote-btn" onclick="castVote('${opt}')">${opt}</button>`
                    ).join('');
                }
            }
        }

        function castVote(opt) {
            if (guestConn && guestConn.open) {
                guestConn.send({ type: 'VOTE', option: opt });
                alert(`已成功投給「${opt}」！`);
            } else {
                alert('目前未成功連接到電腦主控台，請確認電腦網頁已開啟！');
            }
        }

        // === 初始化連線邏輯 ===
        if (!hostId) {
            // 主控台模式
            const peer = new Peer();

            peer.on('open', (id) => {
                const voteUrl = `${window.location.origin}${window.location.pathname}?host=${id}`;
                const qrContainer = document.getElementById("qrcode");
                qrContainer.innerHTML = '';
                new QRCode(qrContainer, { text: voteUrl, width: 160, height: 160 });
                renderCloud();
            });

            peer.on('connection', (conn) => {
                connectedConns.push(conn);

                conn.on('open', () => {
                    conn.send({ type: 'INIT', options: options });
                });

                conn.on('data', (data) => {
                    if (data.type === 'REQ_INIT') {
                        conn.send({ type: 'INIT', options: options });
                    } else if (data.type === 'VOTE' && votes[data.option] !== undefined) {
                        votes[data.option]++;
                        renderCloud();
                    }
                });
            });

        } else {
            // 手機投票模式
            document.getElementById('host-view').style.display = 'none';
            document.getElementById('guest-view').style.display = 'block';

            const statusEl = document.getElementById('status-msg');
            renderGuestButtons(options);

            const peer = new Peer();

            peer.on('open', () => {
                guestConn = peer.connect(hostId);

                guestConn.on('open', () => {
                    statusEl.innerText = "🟢 已成功連線至主控台";
                    statusEl.style.color = "green";
                    guestConn.send({ type: 'REQ_INIT' });
                });

                guestConn.on('data', (data) => {
                    if (data.type === 'INIT' && Array.isArray(data.options)) {
                        options = data.options;
                        renderGuestButtons(options);
                    }
                });

                guestConn.on('error', () => {
                    statusEl.innerText = "🔴 連線異常，請重新掃碼";
                    statusEl.style.color = "red";
                });
            });
        }
    </script>
</body>
</html>
